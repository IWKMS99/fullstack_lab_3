spring.application.name=RoomFlow
server.port=${SERVER_PORT:8080}

spring.main.banner-mode=off

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.datasource.url=jdbc:postgresql://localhost:5435/${POSTGRES_DB:roomflow_db}
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:fialka}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

auth.refresh.cookie-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
auth.refresh.cookie-path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
auth.refresh.cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.refresh.cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
auth.refresh.cleanup.cron=${AUTH_REFRESH_CLEANUP_CRON:0 0 * * * *}
auth.refresh.cleanup.revoked-retention-days=${AUTH_REFRESH_REVOKED_RETENTION_DAYS:7}

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
storage.s3.bucket=${S3_BUCKET:roomflow-files}
storage.s3.presign-ttl-minutes=${S3_PRESIGN_TTL_MINUTES:15}
